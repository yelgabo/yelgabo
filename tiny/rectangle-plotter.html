<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rectangle Plotter | Yelnil Gabo</title>
<meta name="description" content="Type a list of rectangles and inspect their overlaps, coordinates, and area.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f6f1;--ink:#1d2430;--grid:#d5dce8;--axis:#6b7a90;--focus:#1f6fd6;--both:#5b3fb0;--muted:#5c6675;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
.topbar{max-width:1120px;margin:0 auto;padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.topbar a{color:var(--muted);text-decoration:none;font-weight:600}
.topbar a:hover{color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding:28px 24px 48px;display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:start}
h1{font-size:28px;font-weight:600;letter-spacing:-0.01em;margin:0 0 8px}
.hint{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
code{font-family:"IBM Plex Mono",monospace;font-size:13px}
label{display:block;font-size:14px;margin:14px 0 6px}
textarea{width:100%;min-height:120px;resize:vertical;font:15px/1.5 "IBM Plex Mono",monospace;padding:9px 10px;border:1.5px solid var(--grid);border-radius:4px;background:#fff;color:var(--ink)}
textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.swatch{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.result{margin-top:16px;padding:12px 14px;border-left:3px solid var(--both);background:#fff;font-size:14px;line-height:1.7}
.result strong{font-weight:600}
.result ul{list-style:none;margin:8px 0 0;padding:0}
.result li{padding:4px 0;border-top:1px solid var(--grid)}
.result li code{display:block;color:var(--muted)}
svg{width:100%;height:auto;display:block;background:#fff;border:1.5px solid var(--grid);border-radius:4px}
text{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:var(--muted)}
text.label{paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}
@media(max-width:760px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><a href="../index.html">Yelnil Gabo</a><a href="../tools.html">&larr; All tools</a></header>
<main>
<section>
<h1>Rectangle Plotter</h1>
<p class="hint">Each rectangle is <code>[x1, y1, x2, y2]</code>: bottom-left corner, then top-right corner. Enter one or a list, like <code>[[0,0,1,1],[0,1,3,2]]</code>. The plot and overlap checks update as you type.</p>
<label for="rects">Rectangles</label>
<textarea id="rects" spellcheck="false" autocomplete="off">[[0,0,1,1],[0,1,3,2],[1,0,2,2]]</textarea>
<div class="err" id="err"></div>
<div class="result" id="res"></div>
</section>
<section><svg id="plot" viewBox="0 0 720 560" role="img" aria-label="Plot of the rectangles"></svg></section>
</main>
<script>
const W = 720, H = 560, PAD = { l: 44, r: 20, t: 20, b: 36 };
const COLORS = ['#1f6fd6', '#d8541f', '#1a8a4a', '#c2185b', '#b8860b', '#00838f', '#6d4c41', '#7b1fa2'];
const inputEl = document.getElementById('rects');
const errEl = document.getElementById('err');
const resEl = document.getElementById('res');
const svg = document.getElementById('plot');

function toNumbers(text) {
    const nums = [];
    for (const part of text.split(',')) {
        const t = part.trim();
        if (t !== '') {
            nums.push(Number(t));
        }
    }
    return nums;
}

// Accepts [[..],[..]], one [..] per line, or bare numbers in groups of four.
function parse(text) {
    const groups = text.match(/[\[(][^\[\]()]*[\])]/g);
    const chunks = [];
    if (groups) {
        for (const g of groups) {
            chunks.push(toNumbers(g.slice(1, -1)));
        }
    } else {
        const nums = toNumbers(text.replace(/\s+/g, ','));
        for (let i = 0; i < nums.length; i += 4) {
            chunks.push(nums.slice(i, i + 4));
        }
    }
    if (chunks.length === 0) {
        return { error: 'Enter at least one rectangle: [x1, y1, x2, y2].' };
    }
    for (let i = 0; i < chunks.length; i++) {
        const r = chunks[i];
        if (r.length !== 4 || r.some(n => Number.isNaN(n))) {
            return { error: 'rec' + (i + 1) + ' needs four numbers: [x1, y1, x2, y2].' };
        }
        if (r[0] > r[2] || r[1] > r[3]) {
            return { error: 'rec' + (i + 1) + ' needs x1 <= x2 and y1 <= y2.' };
        }
    }
    return { rects: chunks };
}

function niceStep(raw) {
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const c of [1, 2, 5, 10]) {
        if (c * pow >= raw) {
            return c * pow;
        }
    }
    return 10 * pow;
}

function fmt(n) {
    return Number.isInteger(n) ? String(n) : String(Number(n.toFixed(4)));
}

function el(name, attrs, textContent) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const k in attrs) {
        node.setAttribute(k, attrs[k]);
    }
    if (textContent !== undefined) {
        node.textContent = textContent;
    }
    svg.appendChild(node);
    return node;
}

function intersect(a, b) {
    const x1 = Math.max(a[0], b[0]);
    const y1 = Math.max(a[1], b[1]);
    const x2 = Math.min(a[2], b[2]);
    const y2 = Math.min(a[3], b[3]);
    return { x1, y1, x2, y2, w: x2 - x1, h: y2 - y1 };
}

// Coordinate compression: area covered by at least one rectangle, overlaps counted once.
function unionArea(rects) {
    const xs = [...new Set(rects.flatMap(r => [r[0], r[2]]))].sort((a, b) => a - b);
    const ys = [...new Set(rects.flatMap(r => [r[1], r[3]]))].sort((a, b) => a - b);
    let area = 0;
    for (let i = 0; i + 1 < xs.length; i++) {
        for (let j = 0; j + 1 < ys.length; j++) {
            const cx = (xs[i] + xs[i + 1]) / 2;
            const cy = (ys[j] + ys[j + 1]) / 2;
            if (rects.some(r => r[0] < cx && cx < r[2] && r[1] < cy && cy < r[3])) {
                area += (xs[i + 1] - xs[i]) * (ys[j + 1] - ys[j]);
            }
        }
    }
    return area;
}

function draw() {
    const parsed = parse(inputEl.value);
    if (parsed.error) {
        errEl.textContent = parsed.error;
        return;
    }
    errEl.textContent = '';
    const rects = parsed.rects;
    const names = rects.map((_, i) => 'rec' + (i + 1));
    const colors = rects.map((_, i) => COLORS[i % COLORS.length]);

    // One unit of padding beyond the rectangles, snapped to integers.
    const minX = Math.floor(Math.min(...rects.map(r => r[0]))) - 1;
    const maxX = Math.ceil(Math.max(...rects.map(r => r[2]))) + 1;
    const minY = Math.floor(Math.min(...rects.map(r => r[1]))) - 1;
    const maxY = Math.ceil(Math.max(...rects.map(r => r[3]))) + 1;
    const spanX = maxX - minX;
    const spanY = maxY - minY;

    // Same scale on both axes so squares look square.
    const scale = Math.min((W - PAD.l - PAD.r) / spanX, (H - PAD.t - PAD.b) / spanY);
    const plotW = spanX * scale;
    const plotH = spanY * scale;
    const ox = PAD.l + ((W - PAD.l - PAD.r) - plotW) / 2;
    const oy = PAD.t + ((H - PAD.t - PAD.b) - plotH) / 2;
    const X = x => ox + (x - minX) * scale;
    const Y = y => oy + plotH - (y - minY) * scale;

    const allInt = rects.flat().every(Number.isInteger);
    let step = niceStep(Math.max(spanX, spanY) / 16);
    if (allInt && step < 1) {
        step = 1;
    }

    svg.innerHTML = '';

    for (let x = Math.ceil(minX / step) * step; x <= maxX + 1e-9; x += step) {
        const isAxis = Math.abs(x) < 1e-9;
        el('line', { x1: X(x), y1: Y(minY), x2: X(x), y2: Y(maxY),
            stroke: isAxis ? 'var(--axis)' : 'var(--grid)', 'stroke-width': isAxis ? 1.5 : 1 });
        el('text', { x: X(x), y: Y(minY) + 16, 'text-anchor': 'middle' }, fmt(x));
    }
    for (let y = Math.ceil(minY / step) * step; y <= maxY + 1e-9; y += step) {
        const isAxis = Math.abs(y) < 1e-9;
        el('line', { x1: X(minX), y1: Y(y), x2: X(maxX), y2: Y(y),
            stroke: isAxis ? 'var(--axis)' : 'var(--grid)', 'stroke-width': isAxis ? 1.5 : 1 });
        el('text', { x: X(minX) - 8, y: Y(y) + 4, 'text-anchor': 'end' }, fmt(y));
    }

    rects.forEach((r, i) => {
        el('rect', { x: X(r[0]), y: Y(r[3]), width: X(r[2]) - X(r[0]), height: Y(r[1]) - Y(r[3]),
            fill: colors[i], 'fill-opacity': 0.22, stroke: colors[i], 'stroke-width': 2 });
    });

    const pairs = [];
    for (let i = 0; i < rects.length; i++) {
        for (let j = i + 1; j < rects.length; j++) {
            pairs.push({ i, j, box: intersect(rects[i], rects[j]) });
        }
    }
    const overlapping = pairs.filter(p => p.box.w > 0 && p.box.h > 0);
    const touching = pairs.filter(p => p.box.w >= 0 && p.box.h >= 0 && !(p.box.w > 0 && p.box.h > 0));
    const gapCount = pairs.length - overlapping.length - touching.length;

    for (const p of overlapping) {
        const b = p.box;
        el('rect', { x: X(b.x1), y: Y(b.y2), width: X(b.x2) - X(b.x1), height: Y(b.y1) - Y(b.y2),
            fill: 'var(--both)', 'fill-opacity': 0.3, stroke: 'var(--both)', 'stroke-width': 2 });
    }

    // Labels go last so they sit on top of every fill. Shared corners and centres would
    // stack labels on one spot, so a label skips a duplicate and steps down past a collision.
    const placed = [];
    const seen = new Set();
    function label(x, y, anchor, color, str) {
        if (seen.has(str + '@' + Math.round(x) + ',' + Math.round(y))) {
            return;
        }
        seen.add(str + '@' + Math.round(x) + ',' + Math.round(y));
        const w = str.length * 6.6;
        const left = anchor === 'end' ? x - w : anchor === 'middle' ? x - w / 2 : x;
        while (placed.some(b => left < b.left + b.w && b.left < left + w && Math.abs(b.y - y) < 13)) {
            y += 13;
        }
        placed.push({ left, w, y });
        el('text', { x, y, 'text-anchor': anchor, style: 'fill:' + color, 'font-weight': 500,
            class: 'label' }, str);
    }
    rects.forEach((r, i) => {
        label(X(r[0]) - 4, Y(r[1]) + 14, 'end', colors[i], '(' + fmt(r[0]) + ', ' + fmt(r[1]) + ')');
        label(X(r[2]) + 4, Y(r[3]) - 6, 'start', colors[i], '(' + fmt(r[2]) + ', ' + fmt(r[3]) + ')');
    });
    rects.forEach((r, i) => {
        label(X((r[0] + r[2]) / 2), Y((r[1] + r[3]) / 2) + 4, 'middle', colors[i], names[i]);
    });

    const sumArea = rects.reduce((s, r) => s + (r[2] - r[0]) * (r[3] - r[1]), 0);
    const swatch = i => '<span class="swatch" style="background:' + colors[i] + '"></span>';
    const pairName = p => swatch(p.i) + names[p.i] + ' &amp; ' + swatch(p.j) + names[p.j];
    const boxText = b => 'x ' + fmt(b.x1) + ' to ' + fmt(b.x2) + ', y ' + fmt(b.y1) + ' to ' + fmt(b.y2);

    let html = '<strong>' + rects.length + (rects.length === 1 ? ' rectangle' : ' rectangles') + '</strong>';
    html += '<br>Sum of areas ' + fmt(sumArea) + ', union area ' + fmt(unionArea(rects));
    if (rects.length > 1) {
        html += '<br><strong>Overlapping pairs: ' + overlapping.length + '</strong>';
        html += '<br>Touching ' + touching.length + ', apart ' + gapCount;
    }
    const items = [];
    for (const p of overlapping) {
        items.push('<li>' + pairName(p) + ': overlap, area ' + fmt(p.box.w * p.box.h)
            + '<code>' + boxText(p.box) + '</code></li>');
    }
    for (const p of touching) {
        items.push('<li>' + pairName(p) + ': touch, area 0<code>' + boxText(p.box) + '</code></li>');
    }
    if (items.length > 0) {
        html += '<ul>' + items.join('') + '</ul>';
    }
    resEl.innerHTML = html;
}

inputEl.addEventListener('input', draw);
draw();
</script>
</body>
</html>
