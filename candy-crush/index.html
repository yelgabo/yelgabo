<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candy Crush · Board explorer</title><meta name="description" content="A static visualization of your 10 by 5 Candy Crush board."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ee507b'/%3E%3Ccircle cx='16' cy='16' r='8' fill='white'/%3E%3C/svg%3E"><style>
:root{font-family:ui-sans-serif,system-ui,sans-serif;color:#f4f3ff;background:#111020;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #514d70;background:#302b49;color:inherit;border-radius:10px;padding:12px 17px;font-weight:650;min-height:44px}button:hover:not(:disabled){background:#48405e}button:disabled{opacity:.4;cursor:default}button:focus-visible,textarea:focus-visible{outline:3px solid #ffcb65;outline-offset:3px}header{max-width:1120px;margin:auto;padding:28px 24px 20px;border-bottom:1px solid #353044;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;letter-spacing:-.7px;margin:0}header span{font-size:14px;color:#bcb5d1}.mark{display:inline-block;background:#ed4f80;width:15px;height:15px;border-radius:5px;margin-right:12px;transform:rotate(-12deg)}main{max-width:1120px;margin:auto;padding:28px 24px;display:grid;grid-template-columns:minmax(280px,1.15fr) minmax(260px,1fr);gap:38px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.6;color:#bcb5d1;font-size:15px}.stage{border:1px solid #45405e;background:#1e1a31;border-radius:20px;padding:20px;min-width:0}.board{display:grid;gap:6px;max-width:430px;margin:auto}.cell{aspect-ratio:1;min-height:0;padding:0;border:1px solid #ffffff25;font-variant-numeric:tabular-nums;font-size:clamp(12px,2vw,17px);border-radius:12px;box-shadow:inset 0 2px 0 #ffffff25,0 3px 0 #0003;position:relative;background:var(--color);color:#fff;text-shadow:0 1px 2px #0009}.cell:hover:not(:disabled){background:var(--color);filter:brightness(1.2)}.cell.match{outline:3px solid #ffe596;outline-offset:-3px;box-shadow:0 0 18px #ffcf6750}.cell.match:after{content:'';position:absolute;width:7px;height:7px;background:#fff4bc;border-radius:50%;right:5px;top:5px}.cell.selected{outline:3px solid white;outline-offset:1px}.cell.empty{background:#141122;box-shadow:none;border:1px dashed #48405c;color:#6f6786;text-shadow:none}.axis{display:grid;place-items:center;font-size:12px;color:#9c92b5;min-width:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.primary{background:#f6c361;color:#271b18;border-color:#f6c361}.primary:hover:not(:disabled){background:#ffda91}.status{min-height:58px;margin-top:18px;font-size:16px;line-height:1.5;color:#e6dff4}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;color:#ecb964;margin:0 0 10px}.stats{display:flex;gap:26px;margin:22px 0 30px}.stats strong{display:block;font-size:32px;color:#fff;font-weight:650}.stats span{font-size:14px;color:#bcb5d1}.legend{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 25px}.chip{display:flex;align-items:center;gap:7px;font-size:14px;color:#c6bed7}.dot{width:16px;height:16px;border-radius:5px;background:var(--color)}label{display:block;margin:24px 0 10px;font-size:15px;font-weight:650}textarea{resize:vertical;width:100%;min-height:180px;background:#191528;color:#cfc6e2;border:1px solid #49405c;padding:14px;border-radius:12px;font:13px/1.6 ui-monospace,monospace}.note{font-size:13px;color:#a79dbb}.error{color:#ff9baf;min-height:22px;font-size:14px}details{margin-top:24px;border-top:1px solid #3c334e;padding-top:18px}summary{cursor:pointer;font-size:14px;color:#cfc6e2}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.6;color:#c3bad5}@media(max-width:720px){header{padding:20px 16px}header span{display:none}main{grid-template-columns:minmax(0,1fr);padding:20px 16px;gap:26px}.stage{padding:14px}.cell{font-size:15px}.board{max-width:390px}.stats{margin:16px 0}.controls button{flex:1;padding:10px}.status{min-height:48px}}
.cell{display:grid;place-items:center;cursor:default}.stage{overflow-x:auto}.board{min-width:260px}.cell{overflow-wrap:anywhere;text-align:center}.cell:hover:not(:disabled){filter:none}</style></head><body><header><h1><i class="mark"></i>Candy Crush</h1><span id="dimensions"></span></header><main><section class="stage" aria-label="Candy Crush board"><div id="board" class="board"></div></section><aside><p class="eyebrow">Your board</p><h2>Visualize a grid</h2><p>Paste your matrix below, then update the board. Values stay in the order you provide.</p><form id="form"><label for="input">Board data</label><textarea id="input" spellcheck="false" aria-describedby="error" style="min-height:260px"></textarea><div id="error" class="error" role="alert"></div><button type="submit" class="primary">Update board</button><p id="status" role="status" aria-live="polite" class="note"></p></form><p class="note">Row and column labels start at zero. Values 1–5 have distinct colors. Larger values use gray. Zeros remain visible as empty cells.</p></aside></main><script>
const initial=[[110,5,112,113,0],[210,211,5,113,0],[310,311,3,213,0],[110,5,112,313,0],[210,211,112,113,214],[310,311,5,113,314],[410,411,3,213,414],[610,211,112,313,614],[710,311,412,613,714],[810,411,512,713,1014]];
const palette={1:'#b23263',2:'#176994',3:'#a44928',4:'#546b2c',5:'#6c48aa'};
const $=id=>document.getElementById(id);
function validate(board){
 if(!Array.isArray(board)||!board.length||board.length>50||!Array.isArray(board[0])||!board[0].length||board[0].length>30||!board.every(row=>Array.isArray(row)&&row.length===board[0].length&&row.every(Number.isSafeInteger)))throw Error('Enter a rectangular matrix of integers, up to 50 rows and 30 columns.');
 return board;
}
function render(board){
 validate(board);
 const grid=$('board'),cols=board[0].length;
 grid.replaceChildren();
 grid.style.gridTemplateColumns='18px repeat('+cols+',minmax(44px,1fr))';
 const axis=value=>{const e=document.createElement('span');e.className='axis';e.textContent=value;grid.append(e);};
 axis('');for(let c=0;c<cols;c++)axis(c);
 board.forEach((row,r)=>{axis(r);row.forEach((value,c)=>{const e=document.createElement('div');e.className='cell'+(value===0?' empty':'');e.textContent=value;e.setAttribute('role','img');e.setAttribute('aria-label','Row '+r+', column '+c+': '+value);e.style.setProperty('--color',palette[value]||'#494457');grid.append(e);});});
 $('dimensions').textContent=board.length+' ROWS × '+cols+' COLUMNS';
 $('status').textContent='Showing '+board.length*cols+' cells.';
 $('error').textContent='';
}
$('input').value=JSON.stringify(initial);
$('form').addEventListener('submit',event=>{event.preventDefault();try{render(JSON.parse($('input').value));}catch(error){$('error').textContent=error instanceof SyntaxError?'Enter valid JSON, such as [[1,2],[3,0]].':error.message;}});
render(initial);
</script></body></html>
